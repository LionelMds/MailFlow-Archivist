name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src tests

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: MailFlow-Archivist-windows-installer
            asset_path: MailFlow-Archivist-Setup.exe
          - os: macos-latest
            label: macOS
            artifact_name: MailFlow-Archivist-macos-dmg
            asset_path: MailFlow-Archivist.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10"
          python -m pip install .

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "MailFlow-Archivist" `
            --paths src `
            --icon "src/mailflow/assets/mailflow-icon.ico" `
            --add-data "src/mailflow/assets;mailflow/assets" `
            --collect-submodules keyring.backends `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.QtDesigner `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineQuick `
            --exclude-module PySide6.QtWebEngineWidgets `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32timezone `
            src/mailflow/__main__.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "MailFlow-Archivist" \
            --paths src \
            --icon "src/mailflow/assets/mailflow-icon.icns" \
            --add-data "src/mailflow/assets:mailflow/assets" \
            --collect-submodules keyring.backends \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtWebEngineWidgets \
            src/mailflow/__main__.py

      - name: Show build size
        shell: bash
        run: |
          du -sh dist/*
          find dist -type f -size +20M -print0 | xargs -0 du -h | sort -hr | head -30 || true

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $sourceDir = (Resolve-Path "dist/MailFlow-Archivist").Path
          $iconFile = (Resolve-Path "src/mailflow/assets/mailflow-icon.ico").Path
          $outputDir = (Get-Location).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion="$version" `
            /DSourceDir="$sourceDir" `
            /DIconFile="$iconFile" `
            /DOutputDir="$outputDir" `
            /DOutputBaseFilename="MailFlow-Archivist-Setup" `
            "packaging/windows/MailFlow-Archivist.iss"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          rm -rf dmg-root
          mkdir dmg-root
          if [ -d "dist/MailFlow-Archivist.app" ]; then
            cp -R "dist/MailFlow-Archivist.app" "dmg-root/"
          else
            cp -R "dist/MailFlow-Archivist" "dmg-root/"
          fi
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "MailFlow Archivist" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "MailFlow-Archivist.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.dmg
          generate_release_notes: true
