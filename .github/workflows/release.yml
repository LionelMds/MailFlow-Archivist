name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src tests

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: MailFlow-Archivist-windows
          - os: macos-latest
            label: macOS
            artifact_name: MailFlow-Archivist-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "MailFlow-Archivist" `
            --paths src `
            --collect-all PySide6 `
            --collect-submodules keyring.backends `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32timezone `
            src/mailflow/__main__.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "MailFlow-Archivist" \
            --paths src \
            --collect-all PySide6 \
            --collect-submodules keyring.backends \
            src/mailflow/__main__.py

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/MailFlow-Archivist" `
            -DestinationPath "${{ matrix.artifact_name }}.zip" `
            -Force

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/MailFlow-Archivist.app" ]; then
            zip -r "${{ matrix.artifact_name }}.zip" "dist/MailFlow-Archivist.app"
          else
            zip -r "${{ matrix.artifact_name }}.zip" "dist/MailFlow-Archivist"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
